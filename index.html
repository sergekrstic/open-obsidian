<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Obsidian</title>
<style>
  body { font: 18px -apple-system, system-ui, sans-serif; background: #1e1e1e; color: #ddd;
         display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
  main { text-align: center; padding: 16px; }
  a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 10px;
      background: #7c3aed; color: #fff; text-decoration: none; }
  p { color: #999; font-size: 15px; word-break: break-word; }
</style>
</head>
<body>
<main>
  <div>Opening in Obsidian…</div>
  <a id="go" href="#">Open in Obsidian</a>
  <p id="note"></p>
</main>
<script>
  // Turns https://sergekrstic.github.io/open-obsidian/?f=<path> into obsidian://open?vault=…&file=<path>
  // Only ever builds obsidian://open links. Optional v=<vault name>.
  var q = new URLSearchParams(location.search);
  var file = q.get("f") || "";
  var vault = q.get("v") || "Serge's Ideaverse";
  var url = "obsidian://open?vault=" + encodeURIComponent(vault) +
            (file ? "&file=" + encodeURIComponent(file) : "");
  document.getElementById("go").href = url;
  document.getElementById("note").textContent = file || vault;
  location.href = url;
</script>
</body>
</html>
